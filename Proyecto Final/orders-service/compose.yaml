services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orders-service-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-orders_user}:${POSTGRES_PASSWORD:-orders_password}@db:5432/${POSTGRES_DB:-orders_db}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command:
      ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - .:/app
      - /app/.venv

  db:
    image: postgres:17-alpine
    container_name: orders-service-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orders_db}
      POSTGRES_USER: ${POSTGRES_USER:-orders_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orders_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
