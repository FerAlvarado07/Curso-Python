[project]
name = "order-service"
version = "0.1.0"
description = "API de órdenes implementada con arquitectura hexagonal."
authors = [
    {name = "FerAlvarado07",email = "fernando.alvarado@axity.com"}
]
license = "MIT"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi>=0.143.0,<0.144.0",
    "uvicorn[standard]>=0.54.0,<0.55.0",
    "pydantic>=2.13.5,<3.0.0",
    "sqlalchemy>=2.1.4,<3.0.0",
    "alembic>=1.20.0,<2.0.0",
    "psycopg[binary]>=3.3.6,<4.0.0",
    "httpx[http2]>=0.28.1,<0.29.0",
    "pyjwt (>=2.15.1,<3.0.0)",
    "pwdlib[argon2] (>=0.3.1,<0.4.0)",
    "email-validator (>=2.3.0,<3.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
]



[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black>=26.5.1,<27.0.0",
    "isort>=9.0.1,<10.0.0",
    "ruff>=0.16.9,<0.17.0",
    "pre-commit>=4.6.2,<5.0.0",
    "pytest>=9.1.1,<10.0.0",
    "hypothesis>=6.168.5,<7.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "httpx>=0.28.1,<0.29.0",
    "mypy>=1.11,<2.0",
    "pip-audit>=2.7,<3.0",
]

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"


